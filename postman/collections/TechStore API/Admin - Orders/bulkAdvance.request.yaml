$kind: http-request
name: 'Bulk Advance'
order: 4000
method: POST
url: 'http://localhost:3000/api/admin/orders/bulk-status'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "target_status": "confirmed",
      "orders": [{ "id": {{order_id}}, "expected_status": "pending" }]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Each selected order has a result", function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().data.results).to.be.an("array");
      });
