$kind: http-request
name: 'Login - Valid'
order: 1000
method: POST
url: 'http://localhost:3000/api/auth/login'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "admin@techstore.com",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response time < 2000ms", function () {
        pm.expect(pm.response.responseTime).to.be.below(2000);
      });
      pm.test("Response has success field", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("success");
        pm.expect(json.success).to.be.true;
      });
      pm.test("Response has user object", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("user");
        pm.expect(json.user).to.be.an("object");
      });
      pm.test("User has required fields", function () {
        const user = pm.response.json().user;
        pm.expect(user).to.have.property("id");
        pm.expect(user).to.have.property("email");
      });
      // Save cookie for subsequent requests
      const cookies = pm.response.headers.get("Set-Cookie");
      if (cookies) {
        pm.collectionVariables.set("auth_cookie", cookies);
      }
      // Try to save token if returned in body
      const json = pm.response.json();
      if (json.token) {
        pm.collectionVariables.set("auth_token", json.token);
      }
      if (json.user && json.user.id) {
        pm.collectionVariables.set("user_id", json.user.id);
        pm.collectionVariables.set("user_role", json.user.role || "user");
      }
