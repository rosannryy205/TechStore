$kind: http-request
name: 'Add Option - Attribute Not Found'
order: 5000
method: POST
url: 'http://localhost:3000/api/admin/variant-attributes/999999/options'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "value": "Test Option"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 404 or 400", function () {
        pm.expect(pm.response.code).to.be.oneOf([404, 400]);
      });
