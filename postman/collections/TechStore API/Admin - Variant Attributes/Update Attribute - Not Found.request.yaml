$kind: http-request
name: 'Update Attribute - Not Found'
order: 3000
method: PUT
url: 'http://localhost:3000/api/admin/variant-attributes/999999'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Updated Attribute"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 404 or 400", function () {
        pm.expect(pm.response.code).to.be.oneOf([404, 400]);
      });
